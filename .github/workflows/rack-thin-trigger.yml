name: Rack Files through Thin response framing test

on:
  workflow_dispatch:
  push:
    paths:
      - "research/rack_thin_fixture/**"
      - "research/test_rack_thin_apache.py"
      - ".github/workflows/rack-thin-trigger.yml"

permissions:
  contents: read

concurrency:
  group: rack-thin-trigger
  cancel-in-progress: true

jobs:
  test:
    name: Rack 3.2.5 Thin and Apache 2.4.69
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libapr1-dev \
            libaprutil1-dev libpcre2-dev libnghttp2-dev libtool libtool-bin \
            pkg-config ruby ruby-dev

      - name: Install vulnerable Rack and Thin
        run: |
          sudo gem install --no-document rack -v 3.2.5
          sudo gem install --no-document thin
          command -v thin
          thin -v

      - name: Build Apache 2.4.69
        run: |
          source_dir="$RUNNER_TEMP/httpd-2.4.69"
          install_dir="$RUNNER_TEMP/apache-install-2.4.69"
          git clone --depth 1 --branch 2.4.69 \
            https://github.com/apache/httpd.git "$source_dir"
          cd "$source_dir"
          ./buildconf --with-apr=/usr/bin/apr-1-config
          ./configure --prefix="$install_dir" \
            --enable-proxy --enable-proxy-http --enable-mods-shared=most
          make -j2
          make install

      - name: Test Rack Files mismatch through Thin and Apache
        run: |
          python3 research/test_rack_thin_apache.py \
            --httpd "$RUNNER_TEMP/apache-install-2.4.69/bin/httpd" \
            --server-root "$RUNNER_TEMP/apache-install-2.4.69" \
            --thin "$(command -v thin)" \
            --fixture "$GITHUB_WORKSPACE/research/rack_thin_fixture" \
            --iterations 100
      - name: Control with Apache backend reuse disabled
        run: |
          RACK_THIN_FAST_VICTIM=1 python3 research/test_rack_thin_apache.py \
            --httpd "$RUNNER_TEMP/apache-install-2.4.69/bin/httpd" \
            --server-root "$RUNNER_TEMP/apache-install-2.4.69" \
            --thin "$(command -v thin)" \
            --fixture "$GITHUB_WORKSPACE/research/rack_thin_fixture" \
            --iterations 20 \
            --disablereuse
      - name: Impact marker reaches victim body
        run: |
          RACK_THIN_IMPACT=1 python3 research/test_rack_thin_apache.py \
            --httpd "$RUNNER_TEMP/apache-install-2.4.69/bin/httpd" \
            --server-root "$RUNNER_TEMP/apache-install-2.4.69" \
            --thin "$(command -v thin)" \
            --fixture "$GITHUB_WORKSPACE/research/rack_thin_fixture" \
            --iterations 20
