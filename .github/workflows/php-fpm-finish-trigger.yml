name: PHP-FPM finish-request trigger validation

on:
  workflow_dispatch:
  push:
    paths:
      - "research/php_fpm_finish_fixture/**"
      - "research/test_php_fpm_finish_apache.py"
      - ".github/workflows/php-fpm-finish-trigger.yml"

permissions:
  contents: read

concurrency:
  group: php-fpm-finish-trigger
  cancel-in-progress: true

jobs:
  test:
    name: Apache 2.4.69 mod_proxy_fcgi reuse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install Apache and PHP-FPM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libapr1-dev \
            libaprutil1-dev libpcre2-dev libnghttp2-dev libtool libtool-bin \
            pkg-config php-fpm

      - name: Build Apache 2.4.69 with mod_proxy_fcgi
        run: |
          source_dir="$RUNNER_TEMP/httpd-2.4.69"
          install_dir="$RUNNER_TEMP/apache-install-2.4.69"
          git clone --depth 1 --branch 2.4.69 \
            https://github.com/apache/httpd.git "$source_dir"
          cd "$source_dir"
          ./buildconf --with-apr=/usr/bin/apr-1-config
          ./configure --prefix="$install_dir" \
            --enable-proxy --enable-proxy-fcgi --enable-mods-shared=most
          make -j2
          make install

      - name: Run PHP-FPM #18275 pattern through Apache
        run: |
          python3 research/test_php_fpm_finish_apache.py \
            --httpd "$RUNNER_TEMP/apache-install-2.4.69/bin/httpd" \
            --server-root "$RUNNER_TEMP/apache-install-2.4.69" \
            --docroot "$GITHUB_WORKSPACE/research/php_fpm_finish_fixture"
