name: Candidate B localhost test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Apache 2.4.69 and trunk
    runs-on: ubuntu-latest
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install Apache build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libapr1-dev \
            libaprutil1-dev libpcre2-dev libnghttp2-dev libtool libtool-bin \
            pkg-config php-cli

      - name: Reproduce real-world Collabora response-boundary bug
        run: |
          mkdir -p "$RUNNER_TEMP/collabora-length-test"
          mkdir -p "$RUNNER_TEMP/collabora-length-test/tests"
          curl --fail --location \
            https://raw.githubusercontent.com/CollaboraOnline/richdocumentscode/aff40c487bcedecc6a03b69dc999a5c3ab148a04/proxy.php \
            --output "$RUNNER_TEMP/collabora-length-test/proxy.php"
          # The upstream test server binds IPv4 loopback; make PHP's local
          # CODE endpoint deterministic on Ubuntu runners where localhost may
          # resolve to IPv6 first.
          sed -i 's/localhost/127.0.0.1/g' \
            "$RUNNER_TEMP/collabora-length-test/proxy.php"
          curl --fail --location \
            https://raw.githubusercontent.com/CollaboraOnline/richdocumentscode/refs/pull/357/head/tests/proxy-response-length.php \
            --output "$RUNNER_TEMP/collabora-length-test/tests/proxy-response-length.php"
          set +e
          php "$RUNNER_TEMP/collabora-length-test/tests/proxy-response-length.php" \
            > "$RUNNER_TEMP/collabora-length-test/output.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/collabora-length-test/output.log"
          test "$status" -ne 0
          grep -q "followed by another response" \
            "$RUNNER_TEMP/collabora-length-test/output.log"
          echo "collabora_unpatched_proxy_extra_response=observed"

      - name: Build and test both upstream versions
        run: |
          for ref in 2.4.69 trunk; do
            source_dir="$RUNNER_TEMP/httpd-$ref"
            install_dir="$RUNNER_TEMP/apache-install-$ref"
            git clone --depth 1 --branch "$ref" \
              https://github.com/apache/httpd.git "$source_dir"
            cd "$source_dir"
            ./buildconf --with-apr=/usr/bin/apr-1-config
            ./configure --prefix="$install_dir" \
              --enable-proxy --enable-proxy-http --enable-mods-shared=most
            make -j2
            make install
            cd "$GITHUB_WORKSPACE"
            echo "=== Candidate B matrix: $ref ==="
            python3 research/test_candidate_b.py \
              --httpd "$install_dir/bin/httpd" \
              --server-root "$install_dir" \
              --case all \
              --iterations 100
          done
