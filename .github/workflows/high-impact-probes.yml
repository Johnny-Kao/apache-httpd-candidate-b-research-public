name: Candidate B high-impact probes

on:
  workflow_dispatch:
  push:
    paths:
      - "research/test_high_impact_apache.py"
      - ".github/workflows/high-impact-probes.yml"

permissions:
  contents: read

concurrency:
  group: candidate-b-high-impact
  cancel-in-progress: true

jobs:
  probe:
    name: Apache 2.4.69 headers and browser canary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out research repository
        uses: actions/checkout@v4

      - name: Install Apache and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libapr1-dev \
            libaprutil1-dev libpcre2-dev libnghttp2-dev libtool libtool-bin \
            pkg-config chromium

      - name: Build Apache 2.4.69
        run: |
          source_dir="$RUNNER_TEMP/httpd-2.4.69"
          install_dir="$RUNNER_TEMP/apache-install-2.4.69"
          git clone --depth 1 --branch 2.4.69 \
            https://github.com/apache/httpd.git "$source_dir"
          cd "$source_dir"
          ./buildconf --with-apr=/usr/bin/apr-1-config
          ./configure --prefix="$install_dir" \
            --enable-proxy --enable-proxy-http --enable-mods-shared=most
          make -j2
          make install

      - name: Run high-impact probes and reuse control
        run: |
          python3 research/test_high_impact_apache.py \
            --httpd "$RUNNER_TEMP/apache-install-2.4.69/bin/httpd" \
            --server-root "$RUNNER_TEMP/apache-install-2.4.69" \
            --browser "$(command -v chromium)" \
            --case all
